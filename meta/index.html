<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Meta</title>
  <link rel="stylesheet" href="../style.css">
  <script src="../global.js" type="module"></script>
  <script type="module" src="main.js"></script>
</head>

<body>
  <h1>Meta</h1>
  <p>This page includes stats about the code of this website.</p>

  <h2>Summary</h2>

  <div class="time-filter">
    <label for="commit-progress">Show commits until:</label>
    <input id="commit-progress" type="range" min="0" max="100" value="100">
    <time id="commit-time-display"></time>
  </div>

  <div id="stats"></div>

  <div id="scrolly-1">
    <div id="scatter-story"></div>

    <div id="scatter-plot">
      <h2>Commits by time of day</h2>
      <div id="chart"></div>

      <dl id="commit-tooltip" class="info tooltip" hidden>
        <dt>Commit</dt>
        <dd><a href="" id="commit-link" target="_blank"></a></dd>

        <dt>Date</dt>
        <dd id="commit-date"></dd>

        <dt>Time</dt>
        <dd id="commit-time"></dd>

        <dt>Author</dt>
        <dd id="commit-author"></dd>

        <dt>Lines edited</dt>
        <dd id="commit-lines"></dd>
      </dl>

      <p id="selection-count">No commits selected</p>
      <dl id="language-breakdown" class="stats"></dl>
    </div>
  </div>

  <h2>Codebase evolution</h2>
  <dl id="files"></dl>
</body>
</html>
